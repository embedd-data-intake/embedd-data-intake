  iot-api-service:
    build: ./server
    container_name: iot-api-service
    environment:
      PRIMARY_DB_HOST: postgres-primary
      PRIMARY_DB_PORT: 5432
      PRIMARY_DB_NAME: app_db
      PRIMARY_DB_USER: postgres
      PRIMARY_DB_PASSWORD: primary_password
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5433
      TIMESCALE_DB: telemetry_db
      TIMESCALE_USER: ts_user
      TIMESCALE_PASSWORD: ts_password
    ports:
      - "8080:8080"
    networks:
      - iot-network
    depends_on:
      postgres-primary:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
#      iot-ingestion-service:
#        condition: service_started # Guarantees TimescaleDB schema is migrated before FDW creation

networks:
  iot-network:
    driver: bridge

volumes:
  primary_data:
  timescale_data:
