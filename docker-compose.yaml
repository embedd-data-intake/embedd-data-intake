services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg16
    container_name: timescaledb
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: ts_user
      POSTGRES_PASSWORD: ts_password
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./temp.sql:/docker-entrypoint-initdb.d/01-init.sql # TODO: Remove when adding MQTT Consumer
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_user -d telemetry_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: primary_password
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 5

#  mqtt-broker:
